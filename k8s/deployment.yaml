apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubepulse
  namespace: kubepulse

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubepulse

  template:
    metadata:
      labels:
        app: kubepulse

    spec:
      containers:
        - name: kubepulse

          image: kubepulse:1.0

          imagePullPolicy: Never

          ports:
            - containerPort: 80
