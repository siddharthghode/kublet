apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepulse
  labels:
    app.kubernetes.io/name: kubepulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubepulse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubepulse
    spec:
      containers:
        - name: kubepulse
          image: kubepulse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: kubepulse-config
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
