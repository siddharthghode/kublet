apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: kubepulse-replicaset
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kubepulse
      tier: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubepulse
        tier: frontend
    spec:
      containers:
        - name: kubepulse
          image: kubepulse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
