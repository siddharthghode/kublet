apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-mem-limit-range
  namespace: kubepulse-dev
spec:
  limits:
    - type: Container
      default: # Default limit if not specified
        cpu: "500m"
        memory: "256Mi"
      defaultRequest: # Default request if not specified
        cpu: "100m"
        memory: "128Mi"
      max: # Max allowed limit per container
        cpu: "1"
        memory: "1Gi"
      min: # Min required request per container
        cpu: "50m"
        memory: "64Mi"
