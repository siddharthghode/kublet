apiVersion: batch/v1
kind: Job
metadata:
  name: kubepulse-db-init-job
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: migration
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3 # Retry up to 3 times on failure
  activeDeadlineSeconds: 120 # Timeout after 2 minutes
  template:
    metadata:
      labels:
        job-name: kubepulse-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-initializer
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting database schema migration and assets initialization..."
              sleep 3
              echo "Successfully initialized tables and baseline configurations."
              exit 0
