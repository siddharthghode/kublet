apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubepulse-pod-reader-role
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
rules:
  # Allow viewing pods, services, and endpoints in this namespace
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading deployment status
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
