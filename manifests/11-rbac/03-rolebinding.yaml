apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubepulse-pod-reader-binding
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
subjects:
  - kind: ServiceAccount
    name: kubepulse-sa
    namespace: kubepulse-dev
roleRef:
  kind: Role
  name: kubepulse-pod-reader-role
  apiGroup: rbac.authorization.k8s.io
