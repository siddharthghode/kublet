apiVersion: v1
kind: Service
metadata:
  name: kubepulse-clusterip-svc
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: service
spec:
  type: ClusterIP  # Default service type: reachable only within cluster
  selector:
    app: kubepulse
  ports:
    - name: http
      port: 80         # Port exposed on service cluster IP
      targetPort: 80   # Port on container
      protocol: TCP
