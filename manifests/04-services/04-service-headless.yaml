apiVersion: v1
kind: Service
metadata:
  name: kubepulse-headless-svc
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: service
spec:
  clusterIP: None  # Headless: Kubernetes DNS returns individual Pod IPs (A records)
  selector:
    app: kubepulse
  ports:
    - name: http
      port: 80
      targetPort: 80
