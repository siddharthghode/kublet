apiVersion: v1
kind: Service
metadata:
  name: kubepulse-loadbalancer-svc
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: service
spec:
  type: LoadBalancer  # Requests an external cloud load balancer or works with `minikube tunnel`
  selector:
    app: kubepulse
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
