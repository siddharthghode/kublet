apiVersion: v1
kind: Service
metadata:
  name: kubepulse-nodeport-svc
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: service
spec:
  type: NodePort  # Exposes the service on each Node's IP at a static port (30000-32767)
  selector:
    app: kubepulse
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080  # Optional: specify static port or let k8s allocate
      protocol: TCP
