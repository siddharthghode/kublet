apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubepulse-ingress-tls
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kubepulse.local
      secretName: kubepulse-tls-secret # Secret created via `kubectl create secret tls kubepulse-tls-secret --cert=tls.crt --key=tls.key`
  rules:
    - host: kubepulse.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubepulse-clusterip-svc
                port:
                  number: 80
