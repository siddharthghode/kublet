apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepulse-deployment
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kubepulse-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubepulse
  template:
    metadata:
      labels:
        app: kubepulse
        app.kubernetes.io/name: kubepulse
    spec:
      containers:
        - name: kubepulse
          image: kubepulse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
