apiVersion: v1
kind: Secret
metadata:
  name: kubepulse-secret
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: security
type: Opaque
# stringData allows Kubernetes to base64-encode values automatically upon apply
stringData:
  API_KEY: "k8s-live-secret-key-9921478"
  DB_PASSWORD: "SuperSecureK8sPassword#2026"
  JWT_SECRET: "my-jwt-production-secret-token"
# 'data' field can also be used with manual base64 encoding (e.g. echo -n 'value' | base64)
