apiVersion: v1
kind: ConfigMap
metadata:
  name: kubepulse-config
  namespace: kubepulse-dev
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: configuration
data:
  # Simple Key-Value configuration injected as environment variables
  APP_NAME: "KubePulse Production Grade"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "kubernetes-cluster"
  REGION: "ap-south-1 (Mumbai)"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"

  # Complete file content stored inside ConfigMap and mountable as volume
  config.js: |
    window.__CONFIG__ = {
      APP_NAME: "KubePulse (K8s ConfigMap Live)",
      APP_VERSION: "1.0.0",
      ENVIRONMENT: "kubernetes",
      REGION: "ap-south-1"
    };
