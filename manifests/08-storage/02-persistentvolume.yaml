apiVersion: v1
kind: PersistentVolume
metadata:
  name: kubepulse-manual-pv
  labels:
    type: local
    app.kubernetes.io/name: kubepulse
spec:
  storageClassName: manual-storage
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/tmp/kubepulse-data"
