apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubepulse.fullname" . }}-config
  labels:
    {{- include "kubepulse.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_VERSION: {{ .Values.config.appVersion | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  REGION: {{ .Values.config.region | quote }}
