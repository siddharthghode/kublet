replicaCount: 2

image:
  repository: kubepulse
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  nodePort: null

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: kubepulse.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75

nodeSelector: {}
tolerations: []
affinity: {}

config:
  appName: "KubePulse Helm Edition"
  appVersion: "1.0.0"
  environment: "production"
  region: "ap-south-1"

secret:
  apiKey: "helm-secret-token-demo"
