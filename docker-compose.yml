services:
  kubepulse:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: KubePulse
        VITE_APP_VERSION: 1.0.0
        VITE_ENVIRONMENT: docker
        VITE_REGION: local
    image: kubepulse:latest
    container_name: kubepulse
    ports:
      - "8080:80"
    restart: always
    environment:
      - VITE_APP_NAME=KubePulse
      - VITE_APP_VERSION=1.0.0
      - VITE_ENVIRONMENT=docker
      - VITE_REGION=local
